<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Chabiko Reference Family · 02 先生厳選単語 Study</title>
<!--
  Chabiko Reference Family · Issue #389 · Direction A1 Editorial Calm
  頁 02/03：先生厳選単語 · 学ぶ（単語セッション）
  本檔案是 reference prototype：token 值為探索用，尚未 freeze。
  mobile（390px）為基準，desktop（>=1024px）以同一 HTML 呈現。
  同一套 visual grammar 的「study 表面」：breadcrumb + track-local nav 是
  本頁與 Home 之間的橋樑。
-->
<style>
  /* ══ Shared grammar · reference tokens (NOT frozen) ════════ */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --paper: #FAF8F4;
    --paper-deep: #F4F0E9;
    --ink: #272522;
    --ink-secondary: #5E5A53;
    --ink-muted: #736C66;
    --hairline: #E6E1D8;
    --hairline-strong: #D6D0C5;
    --jade: #536B62;
    --jade-ink: #3E554D;
    --jade-soft: #E7ECE8;
    --coral: #E87961;
    --coral-deep: #B84C38;
    --coral-soft: #F6E6E1;
    --radius-chip: 6px;
    --radius-control: 8px;
    --radius-content: 10px;
    --radius-card: 12px;
    --radius-hero: 16px;
    --font-serif-ja: "Hiragino Mincho ProN", "Yu Mincho", serif;
    --font-serif-zh: "Songti TC", "Songti SC", "Hiragino Mincho ProN", serif;
    --font-sans: "Hiragino Sans", "Noto Sans JP", "Helvetica Neue", Arial, sans-serif;
    --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
    --sp-5: 20px; --sp-6: 24px; --sp-7: 28px; --sp-8: 32px; --sp-10: 40px; --sp-12: 48px;
  }

  body {
    background: #23211E;
    font-family: var(--font-sans);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }
  .app {
    width: 390px;
    min-height: 844px;
    margin: 0 auto;
    background: var(--paper);
    position: relative;
    overflow: hidden;
  }

  /* ══ Device status bar ══════════════════════════════════════ */
  .statusbar {
    height: 44px; padding: 0 28px;
    display: flex; align-items: center; justify-content: space-between;
    font-size: 15px; font-weight: 600; letter-spacing: 0.01em; color: var(--ink);
  }
  .statusbar .sb-right { display: flex; align-items: center; gap: 6px; font-size: 12px; }
  .statusbar .sb-battery {
    width: 22px; height: 11px; border: 1.2px solid var(--ink);
    border-radius: 3px; position: relative; opacity: .85;
  }
  .statusbar .sb-battery::after {
    content: ''; position: absolute; inset: 1.5px 2px auto auto;
    width: 2px; height: 4px; background: var(--ink); border-radius: 1px;
  }

  /* ══ Header · 與 Home 一致 ══════════════════════════════════ */
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 28px 12px;
    border-bottom: 1px solid var(--hairline);
  }
  .brand { display: flex; align-items: baseline; gap: 7px; }
  .brand-mark {
    width: 20px; height: 20px; border-radius: 50%; background: var(--coral);
    display: inline-flex; align-items: center; justify-content: center;
    color: #fff; font-size: 11px; font-weight: 700; font-family: var(--font-serif-ja);
    align-self: center;
  }
  .brand-name { font-family: var(--font-serif-ja); font-size: 17px; font-weight: 700; color: var(--ink); letter-spacing: .02em; }
  .brand-kana { font-size: 10px; color: var(--ink-muted); letter-spacing: .12em; }
  .header-actions { display: flex; align-items: center; gap: 14px; }
  .script-toggle { font-size: 11px; color: var(--ink-secondary); letter-spacing: .08em; }
  .script-toggle b { color: var(--jade-ink); font-weight: 700; }
  .theme-toggle { font-size: 16px; color: var(--ink-secondary); border: none; background: none; cursor: pointer; }

  /* ══ Main ═══════════════════════════════════════════════════ */
  .main { padding: 0 28px 40px; }

  /* ══ Breadcrumb · demoted ═══════════════════════════════════ */
  .breadcrumb {
    margin: 18px 0 0;
    font-size: 11px; letter-spacing: .06em; color: var(--ink-muted);
    display: flex; align-items: center; flex-wrap: wrap; gap: 6px;
  }
  .breadcrumb a { color: var(--ink-muted); text-decoration: none; }
  .breadcrumb a:hover { text-decoration: underline; }
  .breadcrumb .crumb-current { color: var(--ink-secondary); font-weight: 600; }
  .breadcrumb .crumb-sep { color: var(--hairline-strong); }

  /* ══ Track-local nav · native to surface ════════════════════ */
  .track-nav {
    margin-top: 14px;
    display: flex; gap: 24px;
    border-bottom: 1px solid var(--hairline);
  }
  .track-nav a {
    position: relative;
    padding: 8px 0 10px;
    font-size: 13px; font-weight: 600; color: var(--ink-muted);
    text-decoration: none; letter-spacing: .02em;
  }
  .track-nav a.is-active { color: var(--jade-ink); font-weight: 700; }
  .track-nav a.is-active::after {
    content: ''; position: absolute; left: 0; right: 0; bottom: -1px;
    height: 2px; background: var(--jade);
  }
  .track-nav a:hover { color: var(--ink-secondary); }

  /* ══ Page title ═════════════════════════════════════════════ */
  .page-head { margin-top: 24px; }
  h1.page-title {
    font-family: var(--font-serif-ja);
    font-size: 28px; font-weight: 700; line-height: 1.3; color: var(--ink);
    letter-spacing: .01em;
  }
  .page-lead {
    margin-top: 8px;
    font-size: 13px; line-height: 1.8; color: var(--ink-secondary);
  }

  /* ══ Session meta row ═══════════════════════════════════════ */
  .session-meta {
    margin-top: 24px;
    display: flex; align-items: baseline; justify-content: space-between; gap: 12px;
    font-size: 11.5px; color: var(--ink-muted); font-variant-numeric: tabular-nums;
  }
  .session-meta .counts { display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
  .session-meta .counts b { color: var(--ink-secondary); font-weight: 700; }
  .session-meta .pos b { color: var(--jade-ink); font-weight: 700; }

  /* ══ Flashcard · the one genuine object card ════════════════ */
  .flashcard {
    margin-top: 14px;
    background: var(--paper-deep);
    border: 1px solid var(--hairline);
    border-radius: var(--radius-card);
    padding: 28px 28px 26px;
    text-align: center;
    display: flex; flex-direction: column; align-items: center;
    min-height: 480px;
  }
  .flashcard-state {
    align-self: flex-start;
    font-size: 10.5px; font-weight: 700; color: var(--jade-ink);
    letter-spacing: .12em;
  }
  .flashcard-word {
    margin-top: 14px;
    font-family: var(--font-serif-zh);
    font-size: 52px; font-weight: 700; line-height: 1.2; color: var(--ink);
    letter-spacing: .04em;
    overflow-wrap: anywhere;
  }
  .flashcard-answer {
    margin-top: 18px;
    padding-top: 16px;
    border-top: 1px solid var(--hairline);
    width: 100%;
    display: flex; flex-direction: column; align-items: center; gap: 5px;
  }
  .answer-pinyin {
    font-size: 14px; color: var(--ink-muted); letter-spacing: .04em;
  }
  .answer-japanese {
    font-size: 16px; font-weight: 700; color: var(--ink);
  }
  .answer-traditional {
    font-size: 12px; color: var(--ink-muted); letter-spacing: .02em;
  }
  .flashcard-illustration {
    display: block;
    margin-top: 20px;
    max-width: 180px; max-height: 120px;
    width: auto; height: auto;
    object-fit: contain;
    border-radius: var(--radius-content);
  }

  /* ══ Self-rating · three quiet choices ══════════════════════ */
  .rating-row {
    margin-top: 22px;
    display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px;
    width: 100%;
  }
  .rating-btn {
    min-height: 46px;
    border: 1px solid var(--hairline-strong);
    border-radius: var(--radius-control);
    background: var(--paper);
    font-family: inherit; font-size: 13px; font-weight: 700;
    cursor: pointer;
    padding: 8px 6px;
    letter-spacing: .02em;
  }
  .rating-btn:hover { border-color: var(--ink-muted); }
  .rating-btn--again { color: var(--coral-deep); }
  .rating-btn--unsure { color: var(--ink-secondary); }
  .rating-btn--known { color: var(--jade-ink); }
  .rating-hint {
    margin-top: 10px;
    font-size: 10.5px; color: var(--ink-muted); letter-spacing: .04em;
  }

  /* ══ Reveal contract annotation ═════════════════════════════ */
  .reveal-contract {
    margin-top: 16px;
    font-size: 11.5px; line-height: 1.8; color: var(--ink-muted);
    text-align: center;
  }

  /* ══ Session footer ═════════════════════════════════════════ */
  .session-foot {
    margin-top: 20px;
    text-align: center;
  }
  .reset-link {
    border: none; background: none; cursor: pointer;
    font-family: inherit;
    font-size: 11px; color: var(--ink-muted); letter-spacing: .02em;
    padding: 8px 0;
  }
  .reset-link:hover { text-decoration: underline; text-underline-offset: 3px; }

  /* ══ Desktop representative (>=1024px) ═════════════════════ */
  @media (width >= 1024px) {
    body { background: var(--paper); }
    .statusbar { display: none; }
    .app { width: 100%; min-height: 100dvh; margin: 0; overflow: visible; }
    .main { max-width: 720px; margin: 0 auto; padding: 40px 48px 72px; }
    .breadcrumb { margin-top: 24px; }
    .track-nav { gap: 28px; }
    .page-head { margin-top: 32px; }
    .flashcard { min-height: 520px; padding: 44px 40px 32px; }
    .flashcard-illustration { max-width: 220px; max-height: 160px; }
    .flashcard-word { font-size: 56px; }
    .rating-row { max-width: 480px; margin-left: auto; margin-right: auto; }
  }

  /* ══ Narrow mobile (<=374px) ═══════════════════════════════ */
  @media (width <= 374px) {
    .app { width: 100%; }
    .statusbar { padding: 0 20px; }
    .header { padding: 10px 20px 12px; }
    .main { padding: 0 20px 32px; }
    .flashcard { padding: 24px 20px 22px; min-height: 440px; }
    .flashcard-word { font-size: 44px; }
    .flashcard-illustration { max-width: 150px; max-height: 100px; }
    .rating-row { gap: 8px; }
    .rating-btn { font-size: 12px; }
  }

  /* ══ Dark mode · same editorial hierarchy（token 未 freeze）══ */
  @media (prefers-color-scheme: dark) {
    :root {
      --paper: #1E1C19;
      --paper-deep: #2A2723;
      --ink: #EFE9E0;
      --ink-secondary: #C6BFB4;
      --ink-muted: #A29A8E;
      --hairline: #3A352D;
      --hairline-strong: #4C463D;
      --jade: #7FA093;
      --jade-ink: #A5C0B5;
      --jade-soft: #27302B;
      --coral: #F09380;
      --coral-deep: #EB8D74;
      --coral-soft: #352621;
    }
    body { background: #14120F; }
  }
  @media (width >= 1024px) and (prefers-color-scheme: dark) {
    body { background: var(--paper); }
  }
</style>
</head>
<body>
<div class="app">

  <div class="statusbar">
    <span>9:41</span>
    <span class="sb-right">5G&nbsp;&nbsp;◌&nbsp;&nbsp;<span class="sb-battery"></span></span>
  </div>

  <header class="header">
    <div class="brand">
      <span class="brand-mark">C</span>
      <span class="brand-name">Chabiko</span>
      <span class="brand-kana">チャビコ</span>
    </div>
    <div class="header-actions">
      <span class="script-toggle">漢字表記 <b>繁</b>｜<b>簡</b></span>
      <button class="theme-toggle" aria-label="ダークテーマに切り替える">◐</button>
    </div>
  </header>

  <main class="main">

    <!-- Breadcrumb · demoted -->
    <nav class="breadcrumb" aria-label="現在位置">
      <a href="#">ホーム</a>
      <span class="crumb-sep">›</span>
      <span class="crumb-current">先生厳選単語</span>
    </nav>

    <!-- Track-local navigation -->
    <nav class="track-nav" aria-label="先生厳選単語のモード">
      <a href="#" class="is-active" aria-current="page">学ぶ</a>
      <a href="#">単語一覧</a>
      <a href="#">テスト</a>
    </nav>

    <!-- Page title -->
    <header class="page-head">
      <h1 class="page-title">先生厳選単語</h1>
      <p class="page-lead">中国語の先生が選んだ単語を、イラスト付きの短いセッションで練習します。</p>
    </header>

    <!-- Session meta -->
    <div class="session-meta">
      <span class="counts">全<b>20</b>語 ・ 新規<b>8</b> ・ 学習中<b>4</b> ・ 習得済み<b>8</b></span>
      <span class="pos">今回 <b>1</b> / 10語</span>
    </div>

    <!-- Flashcard · revealed state（production contract: 揭示前は画像なし・簡体字のみ） -->
    <section class="flashcard" aria-label="単語カード">
      <p class="flashcard-state">答えを表示済み</p>
      <p class="flashcard-word" lang="zh-Hans">大家</p>

      <div class="flashcard-answer">
        <p class="answer-pinyin" lang="zh-Latn">dà jiā</p>
        <p class="answer-japanese">みんな</p>
        <p class="answer-traditional" lang="zh-Hant">繁体：大家</p>
      </div>

      <img
        class="flashcard-illustration"
        src="../../../../public/assets/vocabulary/teacher-core-v1/ill-teacher-star-1-37e0eb213f0f.webp"
        alt="みんな（大家）のイラスト"
      >

      <div class="rating-row" role="group" aria-label="答えをどう感じたか">
        <button class="rating-btn rating-btn--again" type="button">また</button>
        <button class="rating-btn rating-btn--unsure" type="button">むずかしい</button>
        <button class="rating-btn rating-btn--known" type="button">できた</button>
      </div>
      <p class="rating-hint">答えを確認したら、その単語をどう感じたか選びます</p>
    </section>

    <p class="reveal-contract">表示の流れ：答えを見る前は簡体字のみ（画像なし）。タップ後に答えと画像が表示されます。</p>

    <div class="session-foot">
      <button class="reset-link" type="button">学習データの管理</button>
    </div>

  </main>
</div>
</body>
</html>
