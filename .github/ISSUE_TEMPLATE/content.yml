name: Content
description: Track lesson, vocabulary, phrasebook, illustration, roleplay, or resource curation work.
title: "[content] "
labels:
  - type:content
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal and completion conditions
      description: What can the learner understand or say after this content? What checkable condition proves this issue is done?
      placeholder: "Goal: ... Done when: ..."
    validations:
      required: true
  - type: textarea
    id: source-of-truth
    attributes:
      label: Source of truth
      description: Planning doc, requirements reference, governing issue, or external standard.
      placeholder: "#12, .planning/REQUIREMENTS.md CONT-01, external workbook reference, or similar"
    validations:
      required: true
  - type: textarea
    id: dependency-and-start-conditions
    attributes:
      label: Dependency and start conditions
      description: Issues that must be closed first, schemas that must be final, or blockers that must be resolved before this work begins.
      placeholder: "Blocked by: ... Prerequisite: ..."
    validations:
      required: true
  - type: textarea
    id: frozen-decisions
    attributes:
      label: Frozen implementation decisions
      description: Content selection and canonical strings that are already frozen. If this issue is tracking/research/human-review only (no implementation), state that explicitly here.
      placeholder: "Frozen: Record IDs, canonical Traditional/Simplified/pinyin strings, schema version. OR: This issue is tracking only."
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      value: |
        Exact allowed files/surfaces:
        Forbidden files/surfaces:
    validations:
      required: true
  - type: textarea
    id: test-matrix
    attributes:
      label: Test matrix and preserved behavior
      value: |
        ### Edge cases
        - [ ]

        ### Preserved behavior (must not regress)
        - [ ]
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation commands
      value: |
        - [ ] git diff --check
        - [ ] pnpm lint
        - [ ] pnpm typecheck
        - [ ] pnpm test
        - [ ] pnpm build
        - [ ] Issue-specific checks:
    validations:
      required: true
  - type: textarea
    id: review
    attributes:
      label: Review requirements
      description: Required review types per docs/content/content-review-workflow.md.
      value: |
        Required review dimensions:
        - [ ] Language accuracy (human-language-reviewer)
        - [ ] Script provenance (human-script-verifier) — needed if provenance includes `generated`
        - [ ] Teaching accuracy (human-teaching-reviewer) — needed if content has tone notes, false-friend warnings, or pain-point tags
        - [ ] Lesson loop / Travel Quest (human-teaching-reviewer) — needed for new or modified lessons
        - [ ] Regional usage (human-regional-reviewer) — needed if content includes Taiwan/Mainland claims
        - [ ] Source / license (human-source-reviewer) — needed for resource entries
    validations:
      required: true
  - type: textarea
    id: branch-and-pr
    attributes:
      label: Branch, PR, and isolation
      value: |
        - Branch name:
        - Files allowed to change:
        - Files prohibited from changes:
        - Existing PR reference (if continuing active work):
        - ⚠️ Failed or unmerged work from this issue must NOT be reused as the base of a subsequent issue. Open a fresh branch for each new ticket.
    validations:
      required: true
  - type: textarea
    id: reviewer-gate
    attributes:
      label: Reviewer gate
      value: |
        - [ ] Foreground read-only deepseek-v4-pro reviewer: No blocking findings.
        - [ ] Codex final review passed (pre-merge only).
    validations:
      required: true
  - type: textarea
    id: external-recheck
    attributes:
      label: Pre-implementation freshness check
      description: Before implementation begins, verify that external dependencies, reference materials, or upstream schemas have not changed since this issue was created.
      placeholder: "Confirm workbook version, HSK standard version, or API schema version is still current."
    validations:
      required: true
  - type: textarea
    id: post-merge-recheck
    attributes:
      label: Post-merge external state recheck
      description: After merge, re-fetch main, this issue, and the merged PR to confirm merge is present, this issue is closed, and no duplicate implementation PR remains open.
      value: |
        Named responsibility: {{NAME}}
        - [ ] main contains the merge commit.
        - [ ] This issue is closed.
        - [ ] No duplicate implementation PR remains open.
    validations:
      required: true