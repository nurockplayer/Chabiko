name: Feature
description: Track a product, content, design, or engineering task.
title: "[feature] "
labels:
  - type:feature
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What user-visible outcome should exist when this is done?
    validations:
      required: true
  - type: textarea
    id: source-of-truth
    attributes:
      label: Source of truth
      description: Planning doc, requirements reference, or governing issue.
      placeholder: ".planning/REQUIREMENTS.md FEAT-01, #42, or similar"
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included?
    validations:
      required: true
  - type: textarea
    id: out-of-scope
    attributes:
      label: Out of scope
      description: What should this issue explicitly not do?
    validations:
      required: true
  - type: textarea
    id: forbidden-surfaces
    attributes:
      label: Forbidden surfaces
      description: Code, schemas, validators, dependencies, or CI that must NOT be modified.
      placeholder: "e.g. No content files, no UI components, no AGENTS.md changes."
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Checkable criteria.
      value: |
        - [ ]
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation
      description: Executable validation commands that must pass before merge.
      value: |
        - [ ] git diff --check
    validations:
      required: true
  - type: textarea
    id: branch-isolation
    attributes:
      label: Branch and PR isolation
      description: How this work stays isolated from unrelated changes.
      value: |
        - Branch name:
        - Files allowed to change:
        - Files prohibited from changes:
    validations:
      required: true
  - type: textarea
    id: external-recheck
    attributes:
      label: External state recheck
      description: Before implementation, verify that external dependencies, reference materials, or schemas are still current.
      placeholder: "Confirm that the target API, reference standard, or external data source has not changed since this issue was created."
    validations:
      required: true
  - type: textarea
    id: refs
    attributes:
      label: References
      description: Planning docs, external resources, or related issues.
    validations:
      required: false